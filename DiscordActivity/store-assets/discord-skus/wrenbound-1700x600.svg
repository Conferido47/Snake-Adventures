      <text x="91" y="346" fill="#ffffff" fill-opacity="0.88" font-size="29" font-weight="500">Teal hunter cloak, red sash,</text>
      <text x="91" y="384" fill="#ffffff" fill-opacity="0.88" font-size="29" font-weight="500">and a bronze mask inspired by Wren.</text>

      <g transform="translate(90 448)">
