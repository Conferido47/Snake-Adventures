    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="88" y="91" fill="#55b39e" font-size="22" font-weight="700" letter-spacing="6">SNAKE ADVENTURES // PERMANENT SKIN</text>
      <rect x="88" y="126" width="72" height="7" fill="#be3030"/>
      <rect x="166" y="126" width="28" height="7" fill="#55b39e"/>
