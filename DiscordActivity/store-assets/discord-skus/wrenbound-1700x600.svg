<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="600" viewBox="0 0 1700 600" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">WRENBOUND Snake Adventures skin</title>
  <description id="description">Teal hunter cloak, red sash, and a bronze mask inspired by Wren.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081b1d"/>
      <stop offset="0.58" stop-color="#143d3c"/>
      <stop offset="1" stop-color="#081b1d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55b39e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#55b39e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#55b39e"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
      <rect x="2" y="2" width="4" height="4" fill="#55b39e" fill-opacity="0.12"/>
    </pattern>
    <pattern id="ticks" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="28" fill="#55b39e" fill-opacity="0.08"/>
    </pattern>
    <filter id="snakeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#55b39e" flood-opacity="0.28"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="20" y="20" width="1660" height="560" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1700" height="600" fill="#090b0f"/>
  <rect x="20" y="20" width="1660" height="560" rx="24" fill="url(#background)"/>
